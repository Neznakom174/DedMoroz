<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поздравление от Деда Мороза</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--red2:#8f0a22;--text:#2a1216;--mute:#7d5a60;--field:#fff6f6;--line:#f1cdd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#d3152f 0,#a50d27 55%,#7a0a1d 100%);background-attachment:fixed;color:var(--text);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:32px 16px 150px;position:relative}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
radial-gradient(circle at 12% 20%,rgba(255,120,130,.35) 0,transparent 18%),
radial-gradient(circle at 85% 12%,rgba(255,200,120,.25) 0,transparent 16%),
radial-gradient(circle at 78% 70%,rgba(255,90,110,.3) 0,transparent 22%),
radial-gradient(circle at 20% 82%,rgba(255,170,150,.22) 0,transparent 20%),
radial-gradient(ellipse at 50% 0,rgba(255,255,255,.14) 0,transparent 55%),
radial-gradient(ellipse at center,transparent 55%,rgba(40,0,8,.45) 100%)}
#garland{position:fixed;top:0;left:0;right:0;height:46px;z-index:2;pointer-events:none}
#garland i{position:absolute;top:0;display:block;width:12px;height:18px;border-radius:50% 50% 55% 55%;margin-top:14px;animation:tw 1.8s infinite alternate}
#garland::before{content:"";position:absolute;left:-5%;right:-5%;top:-26px;height:48px;border-bottom:2px solid rgba(40,0,8,.55);border-radius:50%}
@keyframes tw{from{opacity:.35;transform:scale(.9)}to{opacity:1;transform:scale(1.05)}}
#drift{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:0;pointer-events:none}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;width:100%;max-width:640px}
h1{color:#fff;font-family:Lobster,"Trebuchet MS",cursive;font-weight:400;font-size:clamp(34px,8vw,52px);margin:34px 0 12px;line-height:1.1;text-shadow:0 3px 14px rgba(60,0,10,.35)}
.lead{color:#ffe9eb;margin:0 0 24px;line-height:1.6;font-size:17px}
.card{background:#fff;border-radius:30px;padding:26px;box-shadow:0 24px 60px rgba(60,0,10,.35)}
label{display:block;font-size:13px;color:var(--mute);margin:16px 0 8px}
.card>label:first-child{margin-top:0}
input,textarea,select{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:18px;color:var(--text);padding:14px 16px;font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.15)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row label{margin-top:16px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button{border:0;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.go{width:100%;margin-top:24px;padding:16px;color:#fff;background:linear-gradient(135deg,#e0213c,var(--red2));box-shadow:0 10px 26px rgba(200,16,46,.4)}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.65;cursor:wait;transform:none}
.out{display:none;margin-top:20px}
.out.show{display:block;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.text{background:var(--field);border:1.5px dashed var(--red);border-radius:22px;padding:20px;line-height:1.65;white-space:pre-wrap}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;padding:12px;background:#fff;color:var(--red);border:1.5px solid var(--red)}
.acts button:hover{background:var(--red);color:#fff}
.err{color:var(--red2);margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div id="garland"></div>
<svg id="drift" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 C120 20 240 20 360 60 C480 100 600 30 720 45 C840 60 960 100 1080 50 C1140 30 1180 40 1200 50 L1200 120 L0 120Z" fill="#ffffff" opacity=".55"/><path d="M0 90 C150 50 300 60 450 85 C600 110 750 60 900 75 C1050 90 1130 70 1200 80 L1200 120 L0 120Z" fill="#ffffff"/></svg>
<canvas id="snow"></canvas>
<main>
<h1>🎅 Поздравь Деда Мороза</h1>
<p class="lead">Расскажите, что для вас значит Дед Мороз: письма, подарки, детские воспоминания. ИИ соберёт из ваших слов искреннее поздравление для него.</p>
<div class="card">
  <label>Ваше имя</label>
  <input id="name" placeholder="Например, Аня">
  <div class="row">
    <div><label>Кто вы</label><select id="who"><option>Ребёнок</option><option>Подросток</option><option>Взрослый</option><option>Родитель, пишу вместе с ребёнком</option></select></div>
    <div><label>Повод</label><select id="occ"><option>День рождения Деда Мороза (18 ноября)</option><option>Новый год</option></select></div>
  </div>
  <label>Ваши отношения с Дедом Морозом</label>
  <textarea id="story" placeholder="Как верили в него, какие подарки или письма помните, что он для вас значит, что хочется ему сказать…"></textarea>
  <label>Стиль</label>
  <select id="tone"><option>Тёплый и искренний</option><option>Весёлый, с юмором</option><option>В стихах</option><option>Торжественный, как в сказке</option></select>
  <button class="go" id="go">Получить поздравление</button>
  <div class="err" id="err"></div>
  <div class="out" id="out">
    <div class="text" id="res"></div>
    <div class="acts"><button id="copy">Копировать</button><button id="again">Ещё вариант</button></div>
  </div>
</div>
</main>
